<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f4a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spy">

<title>Spy — Party Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Archivo:wght@400;600;800&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful espionage, pass-the-phone party energy, tactile.
   IDEA: a manila case dossier passed hand to hand; each player opens their own file.
   PICTURE: the dossier card itself — tab, paperclip, rubber stamp — is the whole game.
   COLOUR and TYPE: manila #e3c58a on desk green; stamp red accent; Special Elite typewriter + Archivo.
   LAYOUT: single centred column, max 520px, card dominant, big thumb controls at bottom. */
:root{color-scheme:light dark;
--bg:light-dark(#2f4a3a,#16211b);--desk2:light-dark(#365443,#1b2a22);
--paper:light-dark(#e6c98f,#c9ab70);--paper2:light-dark(#d8b878,#b3955c);
--ink:#231a10;--muted:#5d4a30;--red:#c22a1f;--onbg:#f2ead8;--line:rgba(35,26,16,.25)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,var(--desk2),var(--bg));color:var(--onbg);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:400 34px/1.05 "Special Elite",monospace;margin:0;letter-spacing:.02em}
h1 span{color:#ff8a7a}
.small{font-size:13px;opacity:.8}
.folder{position:relative;background:linear-gradient(170deg,var(--paper),var(--paper2));color:var(--ink);border-radius:4px 14px 14px 14px;padding:26px 20px 22px;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 18px 40px rgba(0,0,0,.35),0 3px 0 #9c7f48;margin-top:22px}
.folder::before{content:attr(data-tab);position:absolute;top:-24px;left:0;height:26px;padding:4px 18px 0;background:var(--paper);border-radius:10px 10px 0 0;font:400 13px "Special Elite",monospace;color:var(--muted)}
.clip{position:absolute;top:-14px;right:28px;width:16px;height:46px;border:3px solid #8c8c8c;border-radius:9px;border-bottom-color:transparent}
h2{font:800 26px/1.1 Archivo,system-ui,sans-serif;margin:0 0 6px;text-wrap:balance}
label{display:block;font-weight:600;margin:16px 0 6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}.trio label{margin:10px 0 6px;font-size:14px}
.step{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.step button{width:40px;height:46px;flex:none;border:0;background:transparent;font:800 22px Archivo,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.step output{flex:1;text-align:center;font:400 22px "Special Elite",monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border:2px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font:600 15px Archivo,system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
input[type=text]{width:100%;font:16px Archivo,system-ui,sans-serif;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:rgba(255,255,255,.35);color:var(--ink)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{display:block;width:100%;min-height:56px;margin-top:22px;border:0;border-radius:12px;background:var(--red);color:#fff;font:800 18px Archivo,system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 0 #7d1912}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d1912}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none;min-height:48px;margin-top:10px;font-size:16px}
button:focus-visible,input:focus-visible{outline:3px solid #2b7cff;outline-offset:2px}
.toggle{display:flex;align-items:center;gap:12px;min-height:44px;font-weight:600;cursor:pointer;margin-top:12px}
.toggle input{width:24px;height:24px;accent-color:var(--red)}
.who{font:400 15px "Special Elite",monospace;color:var(--muted)}
.big{font:800 clamp(30px,9vw,44px)/1.05 Archivo,system-ui,sans-serif;margin:10px 0;text-wrap:balance;overflow-wrap:anywhere}
.secret{min-height:230px;display:grid;place-items:center;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:20px;margin-top:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.stamp{display:inline-block;max-width:100%;text-align:center;font:400 clamp(26px,8vw,36px)/1.05 "Special Elite",monospace;color:var(--red);border:4px solid var(--red);padding:8px 16px;border-radius:6px;transform:rotate(-8deg);opacity:.9;mix-blend-mode:multiply}
.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(1.25) rotate(-14deg);opacity:0}}
.timer{font:400 clamp(64px,22vw,104px)/1 "Special Elite";text-align:center;margin:14px 0 4px}
.timer.low{color:var(--red)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
ul.list{list-style:none;padding:0;margin:10px 0 0}
ul.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hide{display:none}
#offline.ok{color:#b8f5c8;font-weight:600}
.linkbtn{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 4px}
ul.credits li{display:block;font-size:14px}ul.credits li b{display:block}ul.credits a{color:var(--ink);overflow-wrap:anywhere}
.pic img{display:block;margin:0 auto;width:min(100%,300px);aspect-ratio:4/3;object-fit:cover;border:6px solid #fbf7ee;border-bottom-width:22px;border-radius:3px;box-shadow:0 8px 18px rgba(0,0,0,.3);transform:rotate(-2deg)}
.spybox{display:flex;align-items:center;gap:16px;margin-top:22px;padding-top:16px;border-top:2px dashed var(--line)}
.spybox .stamp{font-size:26px;flex:none}.spybox ul{flex:1;margin:0}
details.names-box{margin-top:16px}details.names-box summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none}details.names-box summary::-webkit-details-marker{display:none}details.names-box summary::before{content:"+";display:inline-grid;place-items:center;width:24px;height:24px;margin-right:10px;border:2px solid var(--ink);border-radius:6px;font-weight:800}details[open].names-box summary::before{content:"−"}
.tu{margin:12px 0 0;padding:12px 14px;border-radius:10px;background:var(--red);color:#fff;font-weight:600;text-align:center}
.sect{margin-top:18px;padding-top:4px;border-top:1px solid var(--line)}
.ar{font:800 clamp(26px,8vw,38px)/1.3 Cairo,"Noto Sans Arabic",sans-serif;direction:rtl;margin-top:2px}
.arS{font-family:Cairo,"Noto Sans Arabic",sans-serif;direction:rtl;unicode-bidi:isolate}
.pic{font-size:clamp(72px,24vw,108px);line-height:1;margin:12px 0 4px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.lvl{display:inline-block;font:600 12px Archivo,system-ui,sans-serif;padding:2px 10px;border-radius:999px;border:1.5px solid var(--muted);color:var(--muted);margin-top:8px}
.chip small{font-weight:400;opacity:.75}
footer{margin-top:22px;text-align:center}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>SPY<span>.</span></h1><span class="small">Pass-the-phone party game</span></header>

  <!-- SETUP -->
  <section id="setup" class="folder" data-tab="Case file: new mission"><div class="clip"></div>
    <h2>Brief the agents</h2>
    <div class="who">Everyone gets the same secret word. Except the spy.</div>
    <div class="trio">
      <div><label>Players</label><div class="step"><button data-d="players" data-v="-1" aria-label="Fewer players">−</button><output id="players">5</output><button data-d="players" data-v="1" aria-label="More players">+</button></div></div>
      <div><label>Spies</label><div class="step"><button data-d="spies" data-v="-1" aria-label="Fewer spies">−</button><output id="spies">1</output><button data-d="spies" data-v="1" aria-label="More spies">+</button></div></div>
      <div><label>Minutes</label><div class="step"><button data-d="mins" data-v="-1" aria-label="Shorter round">−</button><output id="mins">5</output><button data-d="mins" data-v="1" aria-label="Longer round">+</button></div></div>
    </div>
    <div class="sect"></div><label>Difficulty</label>
    <div class="chips" id="levels"></div>
    <label>Word packs</label>
    <div class="chips" id="cats"></div>
    <div class="row" style="margin-top:10px;justify-content:space-between"><span class="small" style="color:var(--muted)" id="fresh"></span><button class="chip" id="resetUsed" style="min-height:36px;padding:4px 12px;font-size:13px">Reset played words</button></div>
    <label class="toggle"><input type="checkbox" id="hint"> Tell the spy the category</label>
    <details class="names-box"><summary>Player names <span class="small" style="color:var(--muted);font-weight:400;margin-left:6px">optional</span></summary>
    <div class="names" id="names"></div></details>
    <button class="btn" id="start">Start mission</button>
  </section>

  <!-- REVEAL -->
  <section id="reveal" class="folder hide" data-tab="Classified"><div class="clip"></div>
    <div class="who" id="rCount"></div>
    <div class="big" id="rName"></div>
    <div class="secret" id="rCard" role="button" tabindex="0" aria-label="Tap to open your file"></div>
    <button class="btn" id="rNext">Hide &amp; pass</button>
    <div class="dots" id="rDots"></div>
  </section>

  <!-- PLAY -->
  <section id="play" class="folder hide" data-tab="Interrogation"><div class="clip"></div>
    <h2>Ask questions. Find the spy.</h2>
    <div class="who" id="first"></div>
    <div class="timer" id="clock">5:00</div>
    <div class="tu hide" id="tu">Time's up! Everyone point at who you think the spy is.</div>
    <div class="row" style="justify-content:center"><button class="chip" id="pause">Pause</button><button class="chip" id="plus">+1 min</button></div>
    <button class="btn" id="end">Reveal the spy</button>
  </section>

  <!-- RESULT -->
  <section id="result" class="folder hide" data-tab="Case closed"><div class="clip"></div>
    <div class="who">The secret word was</div>
    <div style="text-align:center"><div class="pic" id="wPic"></div><div class="big" id="word"></div><div class="ar" id="wAr"></div></div>
    <div class="spybox"><span class="stamp pop" id="spyStamp">SPY</span><ul class="list" id="spyList"></ul></div>
    <button class="btn" id="again">Play again</button>
    <button class="btn ghost" id="toSetup">Change settings</button>
  </section>

  <footer class="small"><span id="offline">Checking offline mode…</span></footer>
</div>

,"Teddy bear":"things","Watch":"things","Broom":"things","Lebanese flag":"things","Ramadan lantern":"things","Generator":"things","Christmas tree":"things","Fireworks":"things","Service taxi":"things","Hourglass":"things","Telescope":"things","Microscope":"things","Magnet":"things","Candle":"things","Compass":"things","Ladder":"things","Battery":"things","Toothbrush":"things","Teapot":"things","Hammer":"things","Mirror":"things","Trophy":"things","Padlock":"things","Flashlight":"things","Headphones":"things","Washing machine":"things","Fridge":"things","Map":"things","Globe":"things","Calculator":"things","Paintbrush":"things","Envelope":"things","Bell":"things","Crown":"things","Sword":"things","Shield":"things","Rope":"things","Shopping cart":"things","Wheelchair":"things","Tent":"things","Microphone":"things","Radio":"things","Sponge":"things","Baby bottle":"things","Wrench":"things","Joystick":"things","Dallah":"things","Tarboush":"things","Abaya":"things","Keffiyeh":"things","Argileh":"things","Abacus":"things","Anchor":"things","Boomerang":"things","Accordion":"things","Oud":"things","Darbuka":"things","Prayer beads":"things","Evil eye":"things","Stethoscope":"things","Crystal ball":"things","Thermometer":"things","Fire extinguisher":"things","Satellite":"things","Piñata":"things","Syringe":"things","Floppy disk":"things","Typewriter":"things","Stopwatch":"things","Sundial":"things","Kaleidoscope":"things","Gear":"things","Plunger":"things","Mousetrap":"things","Test tube":"things","Magic lamp":"things","Coat hanger":"things","Chopsticks":"things","Safety pin":"things","Paper clip":"things","Pushpin":"things","Screwdriver":"things","Nesting doll":"things","Bowling pin":"things","Dhow":"things"};
const PACKS={},CAT_AR={};
for(const p of DATA){CAT_AR[p.en]=p.ar;PACKS[p.en]=p.w.map(([w,a,pic,d])=>({w,a,p:pic,d}))}
const pic=x=>x.img?`<img src="${x.img}" alt="">`:x.p;
const LEVELS=[["easy","Easy","سهل",[1]],["medium","Medium","وسط",[2]],["hard","Hard","صعب",[3]],["mixed","Mixed","منوّع",[1,2,3]]];
const $=id=>document.getElementById(id);
const S={players:5,spies:1,mins:5,cats:["Places","Food"],level:"medium",hint:false,names:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("spy-settings")||"{}"))}catch(e){}
S.cats=S.cats.filter(c=>PACKS[c]);if(!S.cats.length)S.cats=["Places"];
if(!LEVELS.some(l=>l[0]===S.level))S.level="medium";
let used=new Set();
try{used=new Set(JSON.parse(localStorage.getItem("spy-used")||"[]"))}catch(e){}
const saveUsed=()=>{try{localStorage.setItem("spy-used",JSON.stringify([...used]))}catch(e){}};
const curPool=()=>{const lv=LEVELS.find(l=>l[0]===S.level)[3];return S.cats.flatMap(c=>PACKS[c].filter(x=>lv.includes(x.d)).map(x=>({...x,c})))};
const save=()=>{try{localStorage.setItem("spy-settings",JSON.stringify(S))}catch(e){}};
const maxSpies=()=>Math.max(1,Math.floor((S.players-1)/2));
const limits={players:[3,12],spies:[1,3],mins:[1,15]};

function renderSetup(){
  S.spies=Math.min(S.spies,maxSpies());
  ["players","spies","mins"].forEach(k=>$(k).textContent=S[k]);
  $("levels").innerHTML=LEVELS.map(([id,en,ar])=>`<button class="chip" data-l="${id}" aria-pressed="${S.level===id}">${en} <small class="arS">${ar}</small></button>`).join("");
  const lv=LEVELS.find(l=>l[0]===S.level)[3];
  $("cats").innerHTML=Object.keys(PACKS).map(c=>`<button class="chip" data-c="${c}" aria-pressed="${S.cats.includes(c)}">${c} <small class="arS">${CAT_AR[c]}</small> <small>${PACKS[c].filter(x=>lv.includes(x.d)).length}</small></button>`).join("");
  $("hint").checked=S.hint;
  const pl=curPool(),left=pl.filter(x=>!used.has(x.w)).length;
  $("fresh").textContent=`${left} of ${pl.length} words not played yet`;
  const n=$("names"),old=[...n.querySelectorAll("input")].map(i=>i.value);
  if(old.length)S.names=old;
  n.innerHTML=Array.from({length:S.players},(_,i)=>`<input type="text" id="n${i}" placeholder="Agent ${i+1}" maxlength="16" value="${(S.names[i]||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}">`).join("");
}
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.d,[lo,hi]=limits[k];
  S[k]=Math.min(k==="spies"?Math.min(hi,maxSpies()):hi,Math.max(lo,S[k]+ +b.dataset.v));
  renderSetup();save();
});
$("levels").onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;S.level=b.dataset.l;renderSetup();save()};
$("cats").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;const c=b.dataset.c;
  if(S.cats.includes(c)){if(S.cats.length>1)S.cats=S.cats.filter(x=>x!==c)}else S.cats.push(c);
  renderSetup();save();};
$("resetUsed").onclick=()=>{used.clear();saveUsed();renderSetup()};
$("hint").onchange=e=>{S.hint=e.target.checked;save()};

let G=null,idx=0,open=false,left=0,tick=null,paused=false;
const show=id=>["setup","reveal","play","result"].forEach(s=>$(s).classList.toggle("hide",s!==id));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nameOf=i=>(S.names[i]||"").trim()||`Agent ${i+1}`;

const photoCache={};
function loadPhoto(x){
  const f=PHOTOS[x.w];if(!f||x.img)return;
  if(!photoCache[f])photoCache[f]=fetch(`photos/${f}.json`).then(r=>r.ok?r.json():{}).catch(()=>({}));
  photoCache[f].then(m=>{if(m[x.w]&&G&&G.word===x){x.img=m[x.w];if(open&&!G.spies.has(idx))renderReveal()}});
}
function startGame(){
  S.names=[...$("names").querySelectorAll("input")].map(i=>i.value);save();
  const pool=curPool();
  let fresh=pool.filter(x=>!used.has(x.w));
  if(!fresh.length){pool.forEach(x=>used.delete(x.w));fresh=pool}
  const word=pick(fresh);used.add(word.w);saveUsed();
  const ids=[...Array(S.players).keys()];
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  G={cat:word.c,word,spies:new Set(ids.slice(0,S.spies))};loadPhoto(word);
  idx=0;open=false;renderReveal();show("reveal");
}
function renderReveal(){
  $("rCount").textContent=`File ${idx+1} of ${S.players} — only this agent may look`;
  $("rName").textContent=nameOf(idx);
  $("rDots").innerHTML=Array.from({length:S.players},(_,i)=>`<i class="${i<idx?"on":""}"></i>`).join("");
  const card=$("rCard"),spy=G.spies.has(idx);
  if(!open){card.innerHTML=`<div><div style="font:400 22px 'Special Elite'">TOP SECRET</div><div class="small" style="color:var(--muted);margin-top:8px">Tap to open your file</div></div>`;$("rNext").disabled=true;$("rNext").style.opacity=.4}
  else{
    card.innerHTML=spy
      ?`<div><span class="stamp pop">YOU ARE THE SPY</span><div class="arS" style="margin-top:14px;font-size:22px;font-weight:800;color:var(--red)">أنت الجاسوس</div><div style="margin-top:12px;color:var(--muted)">${S.hint?`Category: <b>${G.cat}</b> · <span class="arS">${CAT_AR[G.cat]}</span><br>`:""}Blend in and guess the word.</div></div>`
      :`<div class="pop"><div class="small" style="color:var(--muted)">${G.cat} · <span class="arS">${CAT_AR[G.cat]}</span></div><div class="pic">${pic(G.word)}</div><div class="big" style="margin:4px 0 0">${G.word.w}</div><div class="ar">${G.word.a}</div><div class="lvl">${["","Easy","Medium","Hard"][G.word.d]}</div><div class="small" style="color:var(--muted);margin-top:8px">Don't say it out loud.</div></div>`;
    $("rNext").disabled=false;$("rNext").style.opacity=1;
  }
  $("rNext").textContent=idx===S.players-1?"Hide & start the round":"Hide & pass";
}
$("rCard").onclick=$("rCard").onkeydown=e=>{if(e.type==="keydown"&&e.key!=="Enter"&&e.key!==" ")return;open=true;renderReveal()};
$("rNext").onclick=()=>{if(!open)return;open=false;
  if(idx<S.players-1){idx++;renderReveal()}else startRound()};

const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function draw(){$("clock").textContent=fmt(left);$("clock").classList.toggle("low",left<=30)}
function startRound(){
  left=S.mins*60;paused=false;$("pause").textContent="Pause";
  $("first").textContent=`${nameOf(Math.floor(Math.random()*S.players))} asks the first question.`;
  draw();$("tu").classList.add("hide");show("play");clearInterval(tick);
  tick=setInterval(()=>{if(paused)return;left=Math.max(0,left-1);draw();if(!left){clearInterval(tick);$("tu").classList.remove("hide");try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}},1000);
}
$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"Resume":"Pause"};
$("plus").onclick=()=>{left+=60;draw()};
$("end").onclick=()=>{clearInterval(tick);
  $("word").textContent=G.word.w;$("wAr").textContent=G.word.a;$("wPic").innerHTML=pic(G.word);
  $("spyStamp").textContent=G.spies.size>1?"SPIES":"SPY";
  $("spyList").innerHTML=[...G.spies].sort((a,b)=>a-b).map(i=>`<li><b>${nameOf(i).replace(/[&<>]/g,"")}</b><span class="who">was the spy</span></li>`).join("");
  const st=$("spyStamp");st.classList.remove("pop");void st.offsetWidth;st.classList.add("pop");
  show("result");};
$("again").onclick=startGame;
$("toSetup").onclick=()=>{renderSetup();show("setup")};
$("start").onclick=startGame;

renderSetup();
}
</script>
<script>
(()=>{
  const el=document.getElementById('offline');
  if(!('serviceWorker' in navigator)||!window.caches){if(el)el.textContent='This browser can\'t save the game for offline play';return;}
  const PACKS=['places','food','jobs','animals','sports-hobbies','things'];
  async function check(){
    let n=0;
    try{for(const p of PACKS)if(await caches.match(new URL('photos/'+p+'.json',location.href).href,{ignoreSearch:true}))n++;}catch(e){}
    if(n===PACKS.length){el.textContent='✓ Ready to play offline';el.className='ok';return true;}
    el.textContent=navigator.onLine?`Saving for offline… ${n}/${PACKS.length} — keep this open`:`Offline: ${n}/${PACKS.length} photo packs saved`;
    el.className='';return false;
  }
  addEventListener('load',async()=>{
    if(!(await check())){const t=setInterval(async()=>{if(await check())clearInterval(t);},1500);}
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.ready.then(reg=>{if(reg.active&&navigator.onLine)reg.active.postMessage('save-photos');});
  });
})();
</script>
